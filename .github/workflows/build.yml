name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Projekt erzeugen
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --platforms=android --project-name dart_counter
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="StanDart"/' android/app/src/main/AndroidManifest.xml
      - name: Android-Startbild ohne rundes Icon
        run: |
          R=android/app/src/main/res
          mkdir -p $R/values-v31 $R/values-night-v31 $R/drawable
          cat > $R/drawable/transparent_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#00000000"/>
              <size android:width="1dp" android:height="1dp"/>
          </shape>
          EOF
          for D in values-v31 values-night-v31; do
          cat > $R/$D/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowSplashScreenBackground">#09080F</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/transparent_icon</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF
          done
          for F in drawable drawable-v21; do
            if [ -d $R/$F ]; then
          cat > $R/$F/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><color android:color="#09080F"/></item>
          </layer-list>
          EOF
            fi
          done
      - name: Icon erzeugen (Pfeil)
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          import math
          S = 1024
          im = Image.new('RGB', (S, S), (9, 8, 15))
          d = ImageDraw.Draw(im)
          k = math.sqrt(.5)
          def T(x, y, off):
              return (S / 2 + off + (k * x + k * y) * S, S / 2 + off + (-k * x + k * y) * S)
          def poly(pts, col, off):
              d.polygon([T(x, y, off) for x, y in pts], fill=col)
          shade = (60, 58, 70)
          for off in (S * .035, 0):
              c = lambda col: shade if off else col
              poly([(-.46, 0), (-.34, -.03), (-.34, .03)], c((244, 242, 250)), off)
              poly([(-.34, -.055), (-.08, -.055), (-.08, .055), (-.34, .055)], c((26, 229, 208)), off)
              poly([(-.08, -.018), (.14, -.018), (.14, .018), (-.08, .018)], c((244, 242, 250)), off)
              poly([(.08, 0), (.2, -.16), (.44, -.16), (.34, 0)], c((154, 107, 255)), off)
              poly([(.08, 0), (.2, .16), (.44, .16), (.34, 0)], c((255, 95, 162)), off)
          im.save('icon.png')
          EOF
      - run: flutter pub get
      - run: flutter pub add --dev flutter_launcher_icons
      - run: |
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "icon.png"\n' > flutter_launcher_icons.yaml
          dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk