name: Build APK & Play Store AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Projekt erzeugen
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --platforms=android --org ch.staehli --project-name standart
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/>\n<uses-permission android:name="android.permission.INTERNET"/>\n<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n<application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="StanDart"/' android/app/src/main/AndroidManifest.xml

      - name: Direkte Vibration & Sprachausgabe aktivieren
        run: |
          MAIN_KT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          test -n "$MAIN_KT"
          PKG=$(head -n 1 "$MAIN_KT" | tr -d '\r')
          cat << 'EOF' > "$MAIN_KT"
          PACKAGE_PLACEHOLDER

          import android.content.Context
          import android.media.AudioAttributes
          import android.os.Build
          import android.os.VibrationAttributes
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.speech.tts.TextToSpeech
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.Locale

          class MainActivity : FlutterActivity() {
              private var tts: TextToSpeech? = null
              private var ttsReady = false

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          val res = tts?.setLanguage(Locale.GERMAN)
                          if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                              tts?.language = Locale.getDefault()
                          }
                          tts?.setSpeechRate(1.05f)
                          ttsReady = true
                      }
                  }

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "ch.staehli.standart/haptic")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "vibrate" -> {
                                  val ms = (call.argument<Int>("ms") ?: 40).toLong().coerceAtLeast(40L)
                                  val vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                                      (getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                                  } else {
                                      @Suppress("DEPRECATION")
                                      getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                                  }
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                      val attrs = VibrationAttributes.Builder()
                                          .setUsage(VibrationAttributes.USAGE_ALARM)
                                          .build()
                                      vibrator.vibrate(VibrationEffect.createOneShot(ms, 255), attrs)
                                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      @Suppress("DEPRECATION")
                                      val attrs = AudioAttributes.Builder()
                                          .setUsage(AudioAttributes.USAGE_ALARM)
                                          .build()
                                      vibrator.vibrate(VibrationEffect.createOneShot(ms, 255), attrs)
                                  } else {
                                      @Suppress("DEPRECATION")
                                      vibrator.vibrate(ms)
                                  }
                                  result.success(null)
                              }
                              "speak" -> {
                                  val text = call.argument<String>("text") ?: ""
                                  if (ttsReady && text.isNotEmpty()) {
                                      tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "standart_score")
                                  }
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF
          sed -i "s|PACKAGE_PLACEHOLDER|$PKG|" "$MAIN_KT"

      - name: Play-Store-Signatur einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "FEHLER: Secret KEYSTORE_PASSWORD fehlt in GitHub Settings!"
            exit 1
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          else
            keytool -genkey -v \
              -keystore android/upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=StanDart, O=Staehli, C=CH"
            mkdir -p keystore-backup
            cp android/upload-keystore.jks keystore-backup/upload-keystore.jks
            base64 -w 0 android/upload-keystore.jks > keystore-backup/KEYSTORE_BASE64.txt
          fi

          cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

          python3 - <<'EOF'
          import re
          p = "android/app/build.gradle.kts"
          s = open(p).read()
          header = (
              'import java.util.Properties\n'
              'import java.io.FileInputStream\n\n'
              'val keystoreProperties = Properties()\n'
              'val keystorePropertiesFile = rootProject.file("key.properties")\n'
              'if (keystorePropertiesFile.exists()) {\n'
              '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
              '}\n\n'
          )
          signing = (
              '    signingConfigs {\n'
              '        create("release") {\n'
              '            keyAlias = keystoreProperties.getProperty("keyAlias")\n'
              '            keyPassword = keystoreProperties.getProperty("keyPassword")\n'
              '            storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }\n'
              '            storePassword = keystoreProperties.getProperty("storePassword")\n'
              '        }\n'
              '    }\n\n'
              '    buildTypes {'
          )
          s, n1 = re.subn(r'[ \t]*buildTypes\s*\{', signing, s, count=1)
          assert n1 == 1, "buildTypes nicht gefunden"
          s, n2 = re.subn(r'signingConfigs\.getByName\("debug"\)', 'signingConfigs.getByName("release")', s, count=1)
          assert n2 == 1, "debug signingConfig nicht gefunden"
          open(p, "w").write(header + s)
          EOF

      - name: Android-Startbild ohne rundes Icon
        run: |
          R=android/app/src/main/res
          mkdir -p $R/values-v31 $R/values-night-v31 $R/drawable
          cat > $R/drawable/transparent_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#00000000"/>
              <size android:width="1dp" android:height="1dp"/>
          </shape>
          EOF
          for D in values-v31 values-night-v31; do
          cat > $R/$D/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowSplashScreenBackground">#09080F</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/transparent_icon</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF
          done
          for F in drawable drawable-v21; do
            if [ -d $R/$F ]; then
          cat > $R/$F/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><color android:color="#09080F"/></item>
          </layer-list>
          EOF
            fi
          done

      - name: Icon & Play-Store-Grafiken erzeugen
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw, ImageFont
          import math
          S = 1024
          im = Image.new('RGB', (S, S), (9, 8, 15))
          d = ImageDraw.Draw(im)
          k = math.sqrt(.5)
          def T(x, y, off):
              return (S / 2 + off + (k * x + k * y) * S, S / 2 + off + (-k * x + k * y) * S)
          def poly(pts, col, off):
              d.polygon([T(x, y, off) for x, y in pts], fill=col)
          shade = (60, 58, 70)
          for off in (S * .035, 0):
              c = lambda col: shade if off else col
              poly([(-.46, 0), (-.34, -.03), (-.34, .03)], c((244, 242, 250)), off)
              poly([(-.34, -.055), (-.08, -.055), (-.08, .055), (-.34, .055)], c((26, 229, 208)), off)
              poly([(-.08, -.018), (.14, -.018), (.14, .018), (-.08, .018)], c((244, 242, 250)), off)
              poly([(.08, 0), (.2, -.16), (.44, -.16), (.34, 0)], c((154, 107, 255)), off)
              poly([(.08, 0), (.2, .16), (.44, .16), (.34, 0)], c((255, 95, 162)), off)
          im.save('icon.png')
          im.resize((512, 512), Image.Resampling.LANCZOS).save('playstore-icon-512.png')

          W, H = 1024, 500
          banner = Image.new('RGB', (W, H), (9, 8, 15))
          bd = ImageDraw.Draw(banner)
          for y in range(16, H, 24):
              for x in range(16, W, 24):
                  bd.ellipse((x - 2, y - 2, x + 2, y + 2), fill=(35, 32, 48))
          banner.paste(im.resize((280, 280), Image.Resampling.LANCZOS), (90, 110))
          font = ImageFont.load_default(size=96)
          bd.text((415, 198), "StanDart", font=font, fill=(0, 229, 200))
          bd.text((410, 193), "StanDart", font=font, fill=(244, 242, 250))
          banner.save('playstore-banner-1024x500.png')
          EOF

      - run: flutter pub get
      - run: flutter pub add --dev flutter_launcher_icons
      - run: |
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "icon.png"\n' > flutter_launcher_icons.yaml
          dart run flutter_launcher_icons
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - name: Keystore-Backup speichern (nur beim 1. Lauf)
        if: hashFiles('keystore-backup/KEYSTORE_BASE64.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-BACKUP-WICHTIG
          path: keystore-backup/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            playstore-icon-512.png
            playstore-banner-1024x500.png
