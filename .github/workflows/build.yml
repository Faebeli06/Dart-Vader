name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Projekt erzeugen
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --platforms=android --project-name dart_counter
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="StanDart"/' android/app/src/main/AndroidManifest.xml
      - name: Icon erzeugen
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          import math
          S = 1024
          im = Image.new('RGB', (S, S), (9, 8, 15))
          d = ImageDraw.Draw(im)
          cols = [(26, 229, 208), (154, 107, 255), (255, 95, 162), (255, 210, 63)]
          rad = [1, .72, .46, .2]
          cnt = [36, 26, 16, 7]
          R = S * .42
          m = S / 2
          for sh in (S * .035, 0):
              for r in range(4):
                  for k in range(cnt[r]):
                      a = k * 2 * math.pi / cnt[r]
                      x = m + sh + math.cos(a) * R * rad[r]
                      y = m + sh + math.sin(a) * R * rad[r]
                      q = S * .026
                      d.ellipse([x - q, y - q, x + q, y + q], fill=(60, 58, 70) if sh else cols[r])
              for k in range(7):
                  t = k / 6
                  x = m + sh + R * 1.05 * (1 - t)
                  y = m + sh - R * 1.05 * (1 - t)
                  q = S * (.018 + .012 * t)
                  d.ellipse([x - q, y - q, x + q, y + q], fill=(60, 58, 70) if sh else (244, 242, 250))
          im.save('icon.png')
          EOF
      - run: flutter pub get
      - run: flutter pub add --dev flutter_launcher_icons
      - run: |
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "icon.png"\n' > flutter_launcher_icons.yaml
          dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk